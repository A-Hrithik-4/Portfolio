<svg viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Ceramic Shell Gradient -->
    <linearGradient id="sylChassis" x1="25" y1="20" x2="95" y2="105" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="45%" stop-color="#F2F0F9"/>
      <stop offset="85%" stop-color="#CBD5F0"/>
      <stop offset="100%" stop-color="#9FB0DC"/>
    </linearGradient>

    <!-- Royal Sapphire Accent Gradient -->
    <linearGradient id="sylSapphire" x1="30" y1="25" x2="90" y2="95" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#7091E6"/>
      <stop offset="60%" stop-color="#3D52A0"/>
      <stop offset="100%" stop-color="#253570"/>
    </linearGradient>

    <!-- Electric Periwinkle Rim -->
    <linearGradient id="sylPeriwinkle" x1="40" y1="20" x2="80" y2="90" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#A5BBFF"/>
      <stop offset="100%" stop-color="#5575DA"/>
    </linearGradient>

    <!-- Deep Obsidian Glass Visor -->
    <linearGradient id="sylVisor" x1="38" y1="36" x2="82" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#141829"/>
      <stop offset="100%" stop-color="#070913"/>
    </linearGradient>

    <!-- Intense Neon Cyan Eye Glow -->
    <filter id="sylEyeGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="2.2" result="blur1"/>
      <feGaussianBlur stdDeviation="4" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur2"/>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Thruster Flame Glow -->
    <filter id="sylThrusterGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Floating Ground Shadow -->
    <radialGradient id="sylGroundShadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="rgba(45, 62, 128, 0.45)"/>
      <stop offset="60%" stop-color="rgba(45, 62, 128, 0.15)"/>
      <stop offset="100%" stop-color="rgba(45, 62, 128, 0)"/>
    </radialGradient>
  </defs>

  <!-- Ground Soft Drop Shadow -->
  <ellipse cx="60" cy="112" rx="32" ry="5.5" fill="url(#sylGroundShadow)"/>

  <!-- Thruster Plasma Glow (Hover Propulsion) -->
  <g filter="url(#sylThrusterGlow)">
    <ellipse cx="60" cy="98" rx="14" ry="4.5" fill="#7091E6" opacity="0.8"/>
    <ellipse cx="60" cy="100" rx="8" ry="3.2" fill="#00F0FF"/>
    <circle cx="60" cy="101" r="2" fill="#FFFFFF"/>
  </g>

  <!-- Main Floating Robot Chassis -->
  <g class="syl-robot-root">
    
    <!-- Magnetic Audio Ear Nodes (Side Pods) -->
    <rect x="22" y="44" width="7" height="16" rx="3.5" fill="url(#sylSapphire)" stroke="#A5BBFF" stroke-width="1.2"/>
    <rect x="91" y="44" width="7" height="16" rx="3.5" fill="url(#sylSapphire)" stroke="#A5BBFF" stroke-width="1.2"/>

    <!-- Antenna Mast & Glowing Beacon -->
    <line x1="60" y1="28" x2="60" y2="15" stroke="url(#sylSapphire)" stroke-width="3" stroke-linecap="round"/>
    <circle cx="60" cy="13" r="4.5" fill="#7091E6" stroke="#FFFFFF" stroke-width="1.5" filter="url(#sylEyeGlow)"/>
    <circle cx="60" cy="13" r="2" fill="#00F0FF"/>

    <!-- Head Helmet Shell -->
    <rect x="27" y="26" width="66" height="48" rx="24" fill="url(#sylChassis)" stroke="#FFFFFF" stroke-width="2"/>

    <!-- Top Helmet Specular Shine -->
    <path d="M 38 31 Q 60 27 82 31" stroke="rgba(255, 255, 255, 0.95)" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Head Accent Crest (Sapphire Tech Trim) -->
    <path d="M 48 26 L 72 26 C 70 29, 50 29, 48 26 Z" fill="url(#sylSapphire)"/>

    <!-- Deep Obsidian Curved Visor Glass -->
    <rect x="34" y="37" width="52" height="28" rx="14" fill="url(#sylVisor)" stroke="url(#sylPeriwinkle)" stroke-width="1.5"/>

    <!-- Visor Glass Internal Reflection Arc -->
    <path d="M 39 42 Q 60 38 81 42" stroke="rgba(255, 255, 255, 0.35)" stroke-width="1.5" stroke-linecap="round"/>

    <!-- Expressive Glowing Cyan Eyes -->
    <g filter="url(#sylEyeGlow)">
      <!-- Left Eye -->
      <ellipse cx="49" cy="51" rx="4.8" ry="6" fill="#00F0FF"/>
      <ellipse cx="49" cy="51" rx="3" ry="4" fill="#FFFFFF"/>
      <circle cx="50.8" cy="49" r="1.5" fill="#FFFFFF"/>

      <!-- Right Eye -->
      <ellipse cx="71" cy="51" rx="4.8" ry="6" fill="#00F0FF"/>
      <ellipse cx="71" cy="51" rx="3" ry="4" fill="#FFFFFF"/>
      <circle cx="72.8" cy="49" r="1.5" fill="#FFFFFF"/>
    </g>

    <!-- Cheerful Cheek Glow (Blush Nodes) -->
    <circle cx="41" cy="57" r="2.2" fill="#7091E6" opacity="0.65"/>
    <circle cx="79" cy="57" r="2.2" fill="#7091E6" opacity="0.65"/>

    <!-- Neck Connector Ring -->
    <ellipse cx="60" cy="74" rx="16" ry="4" fill="url(#sylSapphire)"/>

    <!-- Torso Chassis -->
    <path d="M 40 73 C 40 71, 80 71, 80 73 L 84 94 C 84 100, 36 100, 36 94 Z" fill="url(#sylChassis)" stroke="#FFFFFF" stroke-width="2"/>

    <!-- Chest Decorative Tech Plate -->
    <path d="M 46 76 L 74 76 L 70 85 L 50 85 Z" fill="rgba(61, 82, 160, 0.15)" stroke="rgba(112, 145, 230, 0.35)" stroke-width="1"/>

    <!-- Luminous Core Reactor (Center Chest) -->
    <circle cx="60" cy="85" r="5.5" fill="url(#sylSapphire)" stroke="#FFFFFF" stroke-width="1.2"/>
    <circle cx="60" cy="85" r="3.2" fill="#00F0FF" filter="url(#sylEyeGlow)"/>
    <circle cx="60" cy="85" r="1.2" fill="#FFFFFF"/>

    <!-- Left Floating Hand -->
    <ellipse cx="29" cy="85" rx="4.8" ry="7" fill="url(#sylChassis)" stroke="#FFFFFF" stroke-width="1.5" transform="rotate(-18 29 85)"/>
    <ellipse cx="29" cy="85" rx="2" ry="3.5" fill="url(#sylSapphire)" transform="rotate(-18 29 85)"/>

    <!-- Right Floating Hand -->
    <ellipse cx="91" cy="85" rx="4.8" ry="7" fill="url(#sylChassis)" stroke="#FFFFFF" stroke-width="1.5" transform="rotate(18 91 85)"/>
    <ellipse cx="91" cy="85" rx="2" ry="3.5" fill="url(#sylSapphire)" transform="rotate(18 91 85)"/>

    <!-- Thruster Base Ring -->
    <ellipse cx="60" cy="95" rx="14" ry="3.5" fill="url(#sylSapphire)" stroke="#A5BBFF" stroke-width="1"/>
  </g>
</svg>
