<svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Chassis Gradient: Apple Ceramic / Titanium with soft periwinkle tint -->
    <linearGradient id="sylChassis" x1="20" y1="20" x2="80" y2="90" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#EDE8F5"/>
      <stop offset="100%" stop-color="#ADBBDA"/>
    </linearGradient>
    <!-- Primary Blue Gradient -->
    <linearGradient id="sylBlue" x1="30" y1="20" x2="70" y2="80" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#7091E6"/>
      <stop offset="100%" stop-color="#3D52A0"/>
    </linearGradient>
    <!-- Visor Gradient: Dark Sapphire Glass -->
    <linearGradient id="sylVisor" x1="35" y1="36" x2="65" y2="52" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1E2540"/>
      <stop offset="100%" stop-color="#0E1220"/>
    </linearGradient>
    <!-- Soft Glow Filter -->
    <filter id="sylEyeGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <!-- Ambient Shadow -->
    <radialGradient id="sylShadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="rgba(61, 82, 160, 0.35)"/>
      <stop offset="100%" stop-color="rgba(61, 82, 160, 0)"/>
    </radialGradient>
  </defs>

  <!-- Ground Floating Shadow -->
  <ellipse cx="50" cy="94" rx="26" ry="4.5" fill="url(#sylShadow)"/>

  <!-- Main Floating Robot Group -->
  <g class="syl-robot-body">
    <!-- Floating Ear Pods / Audio Nodes -->
    <rect x="22" y="38" width="5" height="12" rx="2.5" fill="url(#sylBlue)"/>
    <rect x="73" y="38" width="5" height="12" rx="2.5" fill="url(#sylBlue)"/>

    <!-- Antenna -->
    <line x1="50" y1="25" x2="50" y2="16" stroke="url(#sylBlue)" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="50" cy="14" r="3.5" fill="#7091E6" filter="url(#sylEyeGlow)"/>

    <!-- Head Chassis -->
    <rect x="25" y="24" width="50" height="38" rx="19" fill="url(#sylChassis)" stroke="#FFFFFF" stroke-width="1.5"/>
    <!-- Specular Highlight on Head -->
    <path d="M 33 27 Q 50 24 67 27" stroke="rgba(255,255,255,0.85)" stroke-width="2" stroke-linecap="round"/>

    <!-- Dark Glass Visor -->
    <rect x="31" y="33" width="38" height="22" rx="11" fill="url(#sylVisor)" stroke="rgba(112, 145, 230, 0.4)" stroke-width="1"/>

    <!-- Expressive Eyes (Glowing Cyan/Electric Periwinkle) -->
    <g filter="url(#sylEyeGlow)">
      <!-- Left Eye -->
      <ellipse cx="42" cy="44" rx="3.5" ry="4.5" fill="#5CE1E6"/>
      <circle cx="43.2" cy="42.5" r="1.2" fill="#FFFFFF"/>
      <!-- Right Eye -->
      <ellipse cx="58" cy="44" rx="3.5" ry="4.5" fill="#5CE1E6"/>
      <circle cx="59.2" cy="42.5" r="1.2" fill="#FFFFFF"/>
    </g>

    <!-- Cute Cheeks / Blush -->
    <ellipse cx="36" cy="48" rx="2" ry="1" fill="rgba(112, 145, 230, 0.35)"/>
    <ellipse cx="64" cy="48" rx="2" ry="1" fill="rgba(112, 145, 230, 0.35)"/>

    <!-- Body Torso -->
    <path d="M 35 60 C 35 58, 65 58, 65 60 L 68 76 C 68 81, 32 81, 32 76 Z" fill="url(#sylChassis)" stroke="#FFFFFF" stroke-width="1.5"/>

    <!-- Core Orb on Chest -->
    <circle cx="50" cy="69" r="4" fill="url(#sylBlue)"/>
    <circle cx="50" cy="69" r="2.2" fill="#5CE1E6" filter="url(#sylEyeGlow)"/>

    <!-- Floating Hands -->
    <ellipse cx="27" cy="68" rx="3.5" ry="5.5" fill="url(#sylChassis)" stroke="rgba(255,255,255,0.9)" stroke-width="1" transform="rotate(-15 27 68)"/>
    <ellipse cx="73" cy="68" rx="3.5" ry="5.5" fill="url(#sylChassis)" stroke="rgba(255,255,255,0.9)" stroke-width="1" transform="rotate(15 73 68)"/>

    <!-- Thruster / Base Ring -->
    <ellipse cx="50" cy="80" rx="10" ry="2.5" fill="url(#sylBlue)" opacity="0.8"/>
    <ellipse cx="50" cy="82" rx="6" ry="1.8" fill="#5CE1E6" filter="url(#sylEyeGlow)"/>
  </g>
</svg>
