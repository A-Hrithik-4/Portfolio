<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 560" width="1024" height="560">
  <defs>
    <linearGradient id="traceBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00171a"/>
      <stop offset="100%" stop-color="#003135"/>
    </linearGradient>
    <linearGradient id="cyanLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0FA4AF"/>
      <stop offset="100%" stop-color="#AFDDE5"/>
    </linearGradient>
    <linearGradient id="anomGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#ef4444" stop-opacity="0"/>
    </linearGradient>
    <filter id="tGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1024" height="560" fill="url(#traceBg)"/>

  <!-- Top Window Header -->
  <rect x="36" y="24" width="952" height="52" rx="10" fill="#02383d" stroke="#024950" stroke-width="1.2"/>
  <circle cx="64" cy="50" r="5" fill="#ef4444"/>
  <circle cx="82" cy="50" r="5" fill="#f59e0b"/>
  <circle cx="100" cy="50" r="5" fill="#10b981"/>

  <text x="126" y="55" fill="#f8fafc" font-family="'Space Grotesk', system-ui, sans-serif" font-weight="700" font-size="16">TRACE :: Track Record Analysis &amp; Classification Engine</text>
  <text x="590" y="54" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="12">Bharat Electronics Limited (BEL)</text>

  <!-- Badges -->
  <rect x="850" y="38" width="124" height="24" rx="4" fill="rgba(56, 189, 248, 0.15)" stroke="#0FA4AF" stroke-width="1"/>
  <text x="862" y="54" fill="#0FA4AF" font-family="'JetBrains Mono', monospace" font-size="11">STREAMLIT · ML</text>

  <!-- Top Metrics Bar -->
  <g transform="translate(36, 90)">
    <!-- Metric 1 -->
    <rect width="222" height="72" rx="8" fill="#012428" stroke="#024950" stroke-width="1"/>
    <text x="16" y="26" fill="#94a3b8" font-family="'Space Grotesk', sans-serif" font-size="11" text-transform="uppercase">Parsed Track Logs</text>
    <text x="16" y="56" fill="#f8fafc" font-family="'Space Grotesk', sans-serif" font-weight="700" font-size="24">148,200 <tspan font-size="12" fill="#34d399">rows</tspan></text>

    <!-- Metric 2 -->
    <rect x="242" width="222" height="72" rx="8" fill="#012428" stroke="#024950" stroke-width="1"/>
    <text x="258" y="26" fill="#94a3b8" font-family="'Space Grotesk', sans-serif" font-size="11" text-transform="uppercase">Anomaly Model</text>
    <text x="258" y="56" fill="#0FA4AF" font-family="'Space Grotesk', sans-serif" font-weight="700" font-size="22">Isolation Forest</text>

    <!-- Metric 3 -->
    <rect x="484" width="222" height="72" rx="8" fill="#012428" stroke="#024950" stroke-width="1"/>
    <text x="500" y="26" fill="#94a3b8" font-family="'Space Grotesk', sans-serif" font-size="11" text-transform="uppercase">Detected Outliers</text>
    <text x="500" y="56" fill="#f87171" font-family="'Space Grotesk', sans-serif" font-weight="700" font-size="24">1.76% <tspan font-size="12" fill="#cbd5e1">(2,610 flagged)</tspan></text>

    <!-- Metric 4 -->
    <rect x="726" width="226" height="72" rx="8" fill="#012428" stroke="#024950" stroke-width="1"/>
    <text x="742" y="26" fill="#94a3b8" font-family="'Space Grotesk', sans-serif" font-size="11" text-transform="uppercase">Audit Reporting</text>
    <text x="742" y="56" fill="#34d399" font-family="'Space Grotesk', sans-serif" font-weight="700" font-size="20">PDF Auto-Export</text>
  </g>

  <!-- Main Chart: Time-Series Parameter Analysis with Anomaly Spikes -->
  <g transform="translate(36, 178)">
    <rect width="616" height="342" rx="10" fill="#091024" stroke="#024950" stroke-width="1"/>
    <text x="20" y="30" fill="#f8fafc" font-family="'Space Grotesk', sans-serif" font-size="13" font-weight="600">Track Parameter Telemetry &amp; Isolation Forest Anomaly Boundary</text>
    <text x="20" y="48" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="10">Signal: Normalized Bearing Drift &amp; Velocity Dispersion · 100Hz Sampled</text>

    <!-- Chart Grid -->
    <g stroke="#02383d" stroke-width="0.8">
      <line x1="40" y1="80" x2="580" y2="80"/>
      <line x1="40" y1="140" x2="580" y2="140"/>
      <line x1="40" y1="200" x2="580" y2="200"/>
      <line x1="40" y1="260" x2="580" y2="260"/>
    </g>

    <!-- Anomaly Threshold Region -->
    <rect x="40" y="60" width="540" height="40" fill="url(#anomGrad)"/>
    <line x1="40" y1="100" x2="580" y2="100" stroke="#ef4444" stroke-width="1.2" stroke-dasharray="4 4"/>
    <text x="460" y="95" fill="#f87171" font-family="'JetBrains Mono', monospace" font-size="10">Decision Threshold: -0.62</text>

    <!-- Parameter Waveform Line -->
    <path d="M 40,220 Q 80,210 120,230 T 200,190 T 250,90 T 280,210 T 360,220 T 430,70 T 470,230 T 540,210 T 580,200"
          fill="none" stroke="url(#cyanLine)" stroke-width="2.5"/>

    <!-- Anomaly Spike Markers -->
    <circle cx="250" cy="90" r="6" fill="#ef4444" filter="url(#tGlow)"/>
    <text x="235" y="75" fill="#fca5a5" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="600">ANOMALY 1</text>

    <circle cx="430" cy="70" r="6" fill="#ef4444" filter="url(#tGlow)"/>
    <text x="415" y="55" fill="#fca5a5" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="600">ANOMALY 2</text>

    <!-- X-Axis Labels -->
    <text x="40" y="290" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="10">00:00</text>
    <text x="170" y="290" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="10">05:00</text>
    <text x="300" y="290" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="10">10:00</text>
    <text x="430" y="290" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="10">15:00</text>
    <text x="560" y="290" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="10">20:00</text>

    <text x="20" y="322" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="11">Data Pipeline: Pandas · NumPy · Scikit-learn · Plotly Interactive Engine</text>
  </g>

  <!-- Right Side: Heatmap & PDF Export Preview -->
  <g transform="translate(668, 178)">
    <!-- Mini Heatmap / Feature Correlation -->
    <rect width="320" height="180" rx="10" fill="#091024" stroke="#024950" stroke-width="1"/>
    <text x="16" y="26" fill="#f8fafc" font-family="'Space Grotesk', sans-serif" font-size="12" font-weight="600">Feature Correlation Heatmap</text>

    <!-- Heatmap Cells -->
    <g transform="translate(16, 42)">
      <rect x="0" y="0" width="64" height="28" fill="#3b82f6" rx="3"/><text x="16" y="18" fill="#fff" font-family="'JetBrains Mono', monospace" font-size="10">1.00</text>
      <rect x="70" y="0" width="64" height="28" fill="#1e3a8a" rx="3"/><text x="86" y="18" fill="#93c5fd" font-family="'JetBrains Mono', monospace" font-size="10">0.42</text>
      <rect x="140" y="0" width="64" height="28" fill="#172554" rx="3"/><text x="156" y="18" fill="#60a5fa" font-family="'JetBrains Mono', monospace" font-size="10">-0.18</text>
      <rect x="210" y="0" width="64" height="28" fill="#1e3a8a" rx="3"/><text x="226" y="18" fill="#93c5fd" font-family="'JetBrains Mono', monospace" font-size="10">0.55</text>

      <rect x="0" y="34" width="64" height="28" fill="#1e3a8a" rx="3"/><text x="16" y="52" fill="#93c5fd" font-family="'JetBrains Mono', monospace" font-size="10">0.42</text>
      <rect x="70" y="34" width="64" height="28" fill="#3b82f6" rx="3"/><text x="86" y="52" fill="#fff" font-family="'JetBrains Mono', monospace" font-size="10">1.00</text>
      <rect x="140" y="34" width="64" height="28" fill="#1e3a8a" rx="3"/><text x="156" y="52" fill="#93c5fd" font-family="'JetBrains Mono', monospace" font-size="10">0.68</text>
      <rect x="210" y="34" width="64" height="28" fill="#172554" rx="3"/><text x="226" y="52" fill="#60a5fa" font-family="'JetBrains Mono', monospace" font-size="10">-0.24</text>

      <rect x="0" y="68" width="64" height="28" fill="#172554" rx="3"/><text x="16" y="86" fill="#60a5fa" font-family="'JetBrains Mono', monospace" font-size="10">-0.18</text>
      <rect x="70" y="68" width="64" height="28" fill="#1e3a8a" rx="3"/><text x="86" y="86" fill="#93c5fd" font-family="'JetBrains Mono', monospace" font-size="10">0.68</text>
      <rect x="140" y="68" width="64" height="28" fill="#3b82f6" rx="3"/><text x="156" y="86" fill="#fff" font-family="'JetBrains Mono', monospace" font-size="10">1.00</text>
      <rect x="210" y="68" width="64" height="28" fill="#1e3a8a" rx="3"/><text x="226" y="86" fill="#93c5fd" font-family="'JetBrains Mono', monospace" font-size="10">0.39</text>
    </g>

    <!-- Automated PDF Audit Box -->
    <rect y="196" width="320" height="146" rx="10" fill="#091024" stroke="#024950" stroke-width="1"/>
    <text x="16" y="222" fill="#f8fafc" font-family="'Space Grotesk', sans-serif" font-size="12" font-weight="600">Audit PDF Report Generation</text>
    <rect x="16" y="238" width="288" height="40" rx="6" fill="#02383d" stroke="#3b82f6" stroke-width="1"/>
    <text x="28" y="262" fill="#34d399" font-family="'JetBrains Mono', monospace" font-size="11">✓ reportlab_audit_export.pdf</text>
    <text x="16" y="302" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="11">Automated classification summaries &amp; anomaly diagnostics for defense review</text>
  </g>
</svg>
